<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>خۆتۆمارکردن - ئۆتۆکورد</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/rtl.css">
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container" style="max-width:400px;margin:2rem auto;">
    <h2>خۆتۆمارکردن</h2>
    <form id="register-form">
      <input type="text" id="name" placeholder="ناو" required>
      <input type="email" id="email" placeholder="ئیمەیڵ" required>
      <input type="password" id="password" placeholder="وشەی نهێنی" required>
      <input type="tel" id="phone" placeholder="ژمارەی مۆبایل">
      <button type="submit">خۆتۆمارکردن</button>
    </form>
  </main>
  <div id="footer-container"></div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    loadComponent('../components/navbar.html', 'navbar-container');
    loadComponent('../components/footer.html', 'footer-container');
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;
      try {
        await fetchAPI('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, phone })
        });
        window.location.href = 'login.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
