<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونەژوورەوە — ئۆتۆکورد</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main>
    <div class="form-card fade-in">
      <h2>بەخێربێیت</h2>
      <p class="subtitle">بچۆ ژوورەوە بۆ مەنیجکردنی هەژمارەکەت</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">ئیمەیڵ</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">وشەی نهێنی</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-submit" id="submit-btn">
          چوونەژوورەوە
        </button>
      </form>

      <p class="form-footer">
        ئەکاونتت نییە؟
        <a href="register.html">خۆتۆمارکردن</a>
      </p>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    loadComponent('../components/navbar.html', 'navbar-container');
    loadComponent('../components/footer.html', 'footer-container');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'چاوەڕوانبە...';
      btn.disabled = true;

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await login(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        btn.textContent = 'چوونەژوورەوە';
        btn.disabled = false;
        alert(err.message);
      }
    });
  </script>
</body>
</html>
